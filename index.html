<style>
/* ===== Tokens ===== */
:root{
  --page:#EDE3D1; --frame:#FBF5EA; --card:#FFFFFF; --soft:#FBF6EC; --soft2:#F5EEDF; --ink:#1F2A44; --ink2:#46506A; --muted:#736C5B; --line:#EEE5D3;
  --yellow:#F7B52C; --yellow2:#FFD873; --ysoft:#FFF2D1; --on-yellow:#1F2A44;
  --ok:#24935F; --oksoft:#E0F4E9; --warn:#B9780A; --warnsoft:#FFF0CF; --bad:#D9443A; --badsoft:#FCE4E1;
  --shadow:0 1px 2px rgba(110,80,20,.06),0 8px 24px -14px rgba(110,80,20,.28);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
  --heat0:#F3ECDD; --h1:#FFE7A8; --h2:#FFD36A; --h3:#F7B52C; --h4:#D99400;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#100E0A; --frame:#191611; --card:#231F18; --soft:#2A251D; --soft2:#312B21; --ink:#F5EEDF; --ink2:#D6CDBB; --muted:#A99F8B; --line:#3A3327;
  --ysoft:#43361A; --oksoft:#163A29; --warnsoft:#3F3115; --badsoft:#47221E; --ok:#4CC98A; --warn:#F0B443; --bad:#F2766D;
  --heat0:#2E281F; --h1:#5A4618; --h2:#8A6A1C; --h3:#C99320; --h4:#F7B52C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#100E0A; --frame:#191611; --card:#231F18; --soft:#2A251D; --soft2:#312B21; --ink:#F5EEDF; --ink2:#D6CDBB; --muted:#A99F8B; --line:#3A3327;
  --ysoft:#43361A; --oksoft:#163A29; --warnsoft:#3F3115; --badsoft:#47221E; --ok:#4CC98A; --warn:#F0B443; --bad:#F2766D;
  --heat0:#2E281F; --h1:#5A4618; --h2:#8A6A1C; --h3:#C99320; --h4:#F7B52C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:var(--fs-md);line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Shell ===== */
.shell{max-width:1520px;margin:16px auto;background:var(--frame);border-radius:32px;padding:18px;display:grid;
  grid-template-columns:84px minmax(0,1fr) 336px;grid-template-rows:auto 1fr;grid-template-areas:"side head rail" "side view rail";gap:18px 24px;box-shadow:0 30px 80px -40px rgba(110,70,10,.35)}
.shell.norail{grid-template-columns:84px minmax(0,1fr);grid-template-areas:"side head" "side view"}
.shell.norail .rail{display:none}
.head{grid-area:head;min-width:0}.view{grid-area:view;min-width:0;container-type:inline-size}.rail{grid-area:rail;min-width:0}.side{grid-area:side}
@media (max-width:1180px){
  .shell{grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"side head" "side rail" "side view"}
}
@media (max-width:720px){
  .shell,.shell.norail{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "rail" "view";grid-template-rows:auto;margin:0;border-radius:0;padding:14px 14px 100px;gap:16px}
}

/* ===== Sidebar ===== */
.side{background:var(--card);border-radius:24px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);position:sticky;top:16px;height:calc(100vh - 68px);max-height:860px;align-self:start}
.logo{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:grid;place-content:center;font-size:21px;margin-bottom:16px}
.nv{width:68px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;font-size:var(--fs-xs);font-weight:500}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:var(--ysoft);color:var(--ink);font-weight:600}
.nv.on svg{stroke:var(--ink)}
.side .sp{flex:1}
@media (max-width:720px){
  .side{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;height:auto;max-height:none;flex-direction:row;justify-content:space-around;padding:6px;z-index:30;border-radius:20px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35)}
  .logo,.side .sp{display:none}
  .nv{flex:1;width:auto}
}

/* ===== Header ===== */
.top{display:flex;align-items:flex-end;gap:16px 20px;flex-wrap:wrap;padding:4px 2px 0}
.hello{flex:1 1 320px;min-width:0}
.meta-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-sm)}
.save{display:inline-flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save.ok i{background:var(--ok)}.save.busy i{background:var(--yellow)}.save.err i{background:var(--bad)}
.hello h1{margin:4px 0 2px;font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hello p{margin:0;color:var(--ink2);font-size:var(--fs-md)}
.hello p b{font-weight:600}
.hello p b.bad{color:var(--bad)}
.actions{display:flex;gap:10px;align-items:center}
.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 6px 0 14px;height:42px;box-shadow:var(--shadow);width:280px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search input::-webkit-search-cancel-button{cursor:pointer}
.search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.search kbd{font:inherit;font-size:var(--fs-xs);color:var(--muted);background:var(--soft2);border-radius:6px;padding:1px 7px}
@media (max-width:720px){.actions{width:100%}.search{flex:1;width:auto}.search kbd{display:none}}
.btn{border:0;background:var(--card);height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:var(--fs-md);box-shadow:var(--shadow);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(.97)}
.btn.y{background:var(--yellow);color:var(--on-yellow)}
.btn.lg{height:42px;padding:0 20px}
.btn.sm{height:32px;padding:0 12px;font-size:var(--fs-sm)}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.btn.danger{color:var(--bad);background:none;box-shadow:inset 0 0 0 1.5px var(--badsoft)}
.btn.icon{width:32px;padding:0}
.scope{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 2px 4px;align-items:center;mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
.scope::-webkit-scrollbar{display:none}
.sc{border:0;background:var(--card);border-radius:999px;height:36px;padding:0 14px 0 5px;display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);color:var(--ink);flex:none}
.sc .ic{width:26px;height:26px;border-radius:50%;display:grid;place-content:center;color:#fff;font-size:var(--fs-xs);font-weight:700;background:var(--pc)}
.sc.on{background:var(--ink);color:var(--card);font-weight:600}
.sc.add{padding:0 14px;color:var(--ink2);background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.sc.add:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 20px 20px;box-shadow:var(--shadow);min-width:0;container-type:inline-size}
.ch{display:flex;align-items:center;gap:8px;margin:0 0 14px;min-height:28px}
.ch h3{margin:0;font-size:var(--fs-lg);font-weight:600;letter-spacing:-.005em}
.ch .cnt{color:var(--muted);font-size:var(--fs-sm)}
.ch .sp{flex:1}
.link{border:0;background:none;color:var(--ink2);font-size:var(--fs-sm);font-weight:500;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--soft);color:var(--ink)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:var(--fs-sm);padding:18px 14px;text-align:center;background:var(--soft);border-radius:var(--r-md)}
.dash{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.dash .full{grid-column:1/-1}
@container (max-width:760px){.dash{grid-template-columns:minmax(0,1fr)}}
.stretch{align-self:stretch}

/* today */
.gauge{position:relative;width:200px;margin:0 auto}
.gauge .num{position:absolute;inset:58px 0 auto;text-align:center;line-height:1}
.gauge .num b{font-size:42px;font-weight:600;letter-spacing:-.03em}
.gauge .num span{font-size:var(--fs-lg);color:var(--muted);margin-left:2px}
.gcap{text-align:center;color:var(--muted);font-size:var(--fs-sm);margin:-18px 0 14px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:var(--r-md);padding:12px 14px;background:linear-gradient(150deg,var(--ysoft),color-mix(in srgb,var(--yellow2) 45%,var(--card)))}
.mini b{display:block;font-size:var(--fs-xl);font-weight:600;line-height:1.2}
.mini b small{font-size:var(--fs-md);font-weight:500;color:var(--ink2)}
.mini span{font-size:var(--fs-sm);color:var(--ink2)}

/* focus list */
.fr{display:grid;grid-template-columns:22px minmax(0,1fr) auto 28px 92px 28px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0;padding-top:2px}
.fr .tt{min-width:0;cursor:pointer}
.fr .tt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .tt small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-sm);overflow:hidden;white-space:nowrap}
.fr .tt:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.when{font-size:var(--fs-sm);color:var(--ink2);text-align:right;white-space:nowrap}
.when.late{color:var(--bad);font-weight:600}
@container (max-width:520px){.fr{grid-template-columns:22px minmax(0,1fr) 28px auto}.fr .pri,.fr .more{display:none}}
.pri{font-size:var(--fs-xs);font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pri.p3{background:var(--badsoft);color:var(--bad)}.pri.p2{background:var(--warnsoft);color:var(--warn)}.pri.p1{background:var(--soft2);color:var(--muted)}
.more{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px;display:grid;place-content:center}
.more:hover{background:var(--soft);color:var(--ink)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-content:center;font-size:10px;font-weight:700;color:#fff;background:hsl(var(--h) 50% 48%);box-shadow:0 0 0 2px var(--card);flex:none}
.av.none{background:var(--soft2);color:var(--muted)}
.avs{display:flex}.avs .av{margin-left:-6px}.avs .av:first-child{margin-left:0}

/* health */
.hg{position:relative;max-width:240px;margin:0 auto}
.hg .pct{position:absolute;left:0;right:0;bottom:2px;text-align:center;line-height:1}
.hg .pct b{font-size:36px;font-weight:600;letter-spacing:-.02em}
.hg .pct small{display:block;color:var(--muted);font-size:var(--fs-sm);margin-top:4px}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.legend div{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:var(--fs-md);color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;font-weight:600;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.4}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.warn{background:var(--warnsoft);color:var(--warn)}.pill.bad{background:var(--badsoft);color:var(--bad)}.pill.mute{background:var(--soft2);color:var(--muted)}
.pill.ok::before,.pill.warn::before,.pill.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@container (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.tile{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:36px 1fr;gap:2px 12px;align-items:center}
.tile .ti{grid-row:1/3;width:36px;height:36px;border-radius:11px;background:var(--ysoft);display:grid;place-content:center;font-size:16px}
.tile.alert .ti{background:var(--badsoft)}
.tile b{font-size:var(--fs-xl);font-weight:600;line-height:1.2}
.tile b small{font-size:var(--fs-sm);font-weight:500;color:var(--ink2);margin-left:3px}
.tile span{font-size:var(--fs-sm);color:var(--ink2)}
.tile em{grid-column:1/-1;font-style:normal;font-size:var(--fs-xs);color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tile.alert b{color:var(--bad)}

/* heat */
.heathead{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.heathead h3{margin:0;font-size:var(--fs-xl);font-weight:600}
.heathead .sp{flex:1}
.hl{display:flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--muted)}
.hl i{width:14px;height:14px;border-radius:4px}
.hgrid{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px 8px}
.hdays{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);align-items:center}
.months{display:grid;gap:4px;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px;min-width:0}
@container (max-width:520px){.hm{gap:2px}.hm i{border-radius:3px}.months{font-size:9.5px}}
.hm i{aspect-ratio:1;border-radius:5px;background:var(--heat0);max-height:26px}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hm i.fut{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 5px)}
.hm i.td{outline:2px solid var(--ink);outline-offset:-1px}

/* project list */
.pl{display:flex;flex-direction:column}
.pli{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 10px;margin:0 -10px;border-radius:14px;width:calc(100% + 20px)}
.pli+.pli{border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.pli:hover{background:var(--soft)}
.pli .r1{display:flex;align-items:center;gap:8px}
.pli .r1 b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pli .r2{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted);font-size:var(--fs-sm)}
.pli .r2 .sp{flex:1}
.pli .r2 strong{color:var(--ink);font-size:var(--fs-md);font-weight:600}
.prog{position:relative;height:6px;border-radius:999px;background:var(--soft2);margin:10px 0 2px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--pc)}
.prog .tm{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);opacity:.45;border-radius:2px;transform:translateX(-1px)}
.legend2{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:14px;height:4px;border-radius:2px;background:var(--ink2)}
.legend2 i.t{width:2px;height:12px;opacity:.5;background:var(--ink)}

/* project hero */
.phero{display:flex;gap:16px;align-items:center}
.tbig{background:var(--pc);color:#fff;border-radius:18px;padding:12px 14px;text-align:center;min-width:96px;flex:none}
.tbig b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.tbig span{font-size:var(--fs-xs);opacity:.95}
.phero h2{margin:0 0 6px;font-size:var(--fs-lg);font-weight:600;line-height:1.3}
.phero .dates{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.dbar{display:grid;grid-template-columns:72px 1fr 40px;gap:10px;align-items:center;font-size:var(--fs-sm);color:var(--ink2);margin-top:10px}
.dbar .tr{height:8px;border-radius:999px;background:var(--soft2);overflow:hidden}
.dbar .tr i{display:block;height:100%;border-radius:999px;background:var(--pc)}
.dbar .tr i.time{background:repeating-linear-gradient(135deg,var(--yellow) 0 5px,var(--yellow2) 5px 10px)}
.dbar b{color:var(--ink);text-align:right;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.dept{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;margin:0 -10px;width:calc(100% + 20px);border-radius:12px}
.dept:hover{background:var(--soft)}
.dept .r{display:flex;align-items:baseline;gap:8px}
.dept .r b{font-weight:500;flex:1}
.dept .r span{font-size:var(--fs-sm);color:var(--muted)}
.dept .r em{font-style:normal;color:var(--bad);font-weight:600;font-size:var(--fs-sm)}
.dept .tr{height:8px;border-radius:999px;background:var(--soft2);overflow:hidden;margin-top:7px}
.dept .tr i{display:block;height:100%;border-radius:999px;background:var(--dc)}
.msi{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.msi:first-child{border-top:0}
.msi .nm{flex:1;min-width:0}
.msi .d{font-size:var(--fs-sm);color:var(--ink2);white-space:nowrap}
.msi .d.late{color:var(--bad);font-weight:600}
.msi.done .nm{text-decoration:line-through;color:var(--muted)}
.msadd{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.msadd input{border:1.5px solid transparent;background:var(--soft);border-radius:var(--r-sm);height:36px;padding:0 10px;min-width:0;outline:none}
.msadd input:focus{border-color:var(--yellow);background:var(--card)}
@container (max-width:380px){.msadd{grid-template-columns:1fr 1fr}.msadd input[type=text]{grid-column:1/-1}}
.ppl .pr{display:flex;align-items:center;gap:10px;padding:7px 0}
.ppl .pr b{font-weight:500;flex:1}
.ppl .pr .n{font-size:var(--fs-sm);color:var(--ink2)}

/* checkbox */
.chk{appearance:none;width:20px;height:20px;border-radius:6px;flex:none;background:var(--card);border:1.5px solid color-mix(in srgb,var(--muted) 55%,transparent);display:grid;place-content:center;cursor:pointer;margin:0}
.chk:hover{border-color:var(--ok);background:var(--oksoft)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ===== Timeline ===== */
.bar-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar-ctl .sp{flex:1}
.bar-ctl .range{font-size:var(--fs-sm);color:var(--ink2)}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;height:30px;padding:0 14px;border-radius:999px;font-weight:500;font-size:var(--fs-sm);color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--card);font-weight:600}
.gantt{overflow-x:auto;--lw:200px}
.gin{min-width:820px;position:relative}
.gr{display:grid;grid-template-columns:var(--lw) minmax(0,1fr)}
.glab{position:sticky;left:0;z-index:4;background:var(--card);padding:0 14px 0 4px;display:flex;align-items:center;gap:10px;min-width:0}
.glab .t{min-width:0;flex:1}
.glab .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.glab .t small{display:block;font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glab.done .t b{text-decoration:line-through;color:var(--muted)}
.ghead .gtrack{display:grid;height:44px}
.gh{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--muted);border-radius:14px 14px 0 0;line-height:1.2}
.gh b{color:var(--ink);font-weight:600;font-size:var(--fs-md)}
.gh.today{background:var(--soft2)}
.gh.today b{color:var(--ink)}
.gh.we b{color:var(--muted);font-weight:500}
.gbody{position:relative}
.gbg{position:absolute;top:0;bottom:0;left:var(--lw);right:0;background:var(--soft);border-radius:0 18px 18px 18px}
.gline{position:absolute;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--muted) 30%,transparent)}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px solid var(--yellow);z-index:3}
.gtoday span{position:absolute;bottom:100%;left:-22px;margin-bottom:-14px;font-size:10px;font-weight:700;background:var(--yellow);color:var(--on-yellow);padding:1px 6px;border-radius:999px;white-space:nowrap}
.gsec{grid-column:1/-1;font-size:var(--fs-xs);font-weight:600;color:var(--muted);padding:14px 4px 2px;position:sticky;left:0}
.gtrack{position:relative;min-width:0}
.grow{min-height:52px}
.grow.tall{min-height:86px}
.gbar{position:absolute;top:9px;height:34px;border-radius:999px;background:var(--bc);border:0;padding:0 12px;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-weight:600;font-size:var(--fs-sm);cursor:pointer;overflow:hidden;min-width:14px}
.gbar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(120deg,transparent 0 18px,rgba(255,255,255,.14) 18px 36px);pointer-events:none}
.gbar .pf{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.14)}
.gbar span{position:relative;z-index:1}
.gbar.cl{border-top-left-radius:4px;border-bottom-left-radius:4px}
.gbar.cr{border-top-right-radius:4px;border-bottom-right-radius:4px}
.gbar.done{opacity:.4}
.gbar.late{box-shadow:0 0 0 2px var(--bad)}
.gms{position:absolute;top:20px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--card);border:2.5px solid var(--ink);z-index:2;border-radius:2px}
.gms.done{background:var(--ok);border-color:var(--ok)}
.gms.late{border-color:var(--bad)}
.gms.launch{background:var(--yellow);border-color:var(--on-yellow);width:14px;height:14px;margin-left:-7px;top:19px}
.gml{position:absolute;top:48px;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;background:var(--soft);padding:0 4px;border-radius:4px;z-index:2}
.gfoot{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 24px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.gf{display:flex;align-items:center;gap:12px;min-width:0}
.gf .ci{width:36px;height:36px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-content:center;font-weight:700;flex:none}
.gf .in{flex:1;min-width:0}
.gf .in b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gf .in .r{display:flex;gap:8px;align-items:center;font-size:var(--fs-xs);color:var(--ink2)}
.gf .tr{flex:1;height:5px;border-radius:999px;background:var(--soft2);overflow:hidden}
.gf .tr i{display:block;height:100%;background:var(--pc);border-radius:999px}
.glegend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin-top:12px}
.glegend span{display:flex;align-items:center;gap:6px}
.glegend .gms{position:static;margin:0}

/* ===== Board ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{border:0;background:var(--card);border-radius:999px;height:36px;padding:0 12px;box-shadow:var(--shadow);max-width:180px}
.filters .hint{margin-left:auto}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px;overflow-x:auto;padding:2px 2px 8px;align-items:start}
.col{background:var(--soft2);border-radius:var(--r-lg);padding:12px;min-height:240px;transition:background .15s,box-shadow .15s}
.col.over{background:var(--ysoft);box-shadow:inset 0 0 0 2px var(--yellow)}
.colh{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-weight:600}
.colh .cnt{font-size:var(--fs-xs);background:var(--card);border-radius:999px;padding:1px 8px;color:var(--ink2);font-weight:600}
.colh .sp{flex:1}
.colh i{width:8px;height:8px;border-radius:50%}
.kc{background:var(--card);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;cursor:grab}
.kc:active{cursor:grabbing}
.kc.dragging{opacity:.4}
.kc .h{display:flex;gap:6px;align-items:flex-start}
.kc .h b{flex:1;font-weight:600;line-height:1.4;cursor:pointer}
.kc p{margin:6px 0 0;color:var(--ink2);font-size:var(--fs-sm);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kc .ft{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink2)}
.kc .ft .sp{flex:1}
.kc .ft .late{color:var(--bad);font-weight:600}
.kc.done .h b{text-decoration:line-through;color:var(--muted);font-weight:500}
.kc.done{box-shadow:none;background:color-mix(in srgb,var(--card) 70%,transparent)}
.kc select{display:none}
@media (hover:none){.kc select{display:block;border:0;background:var(--soft);border-radius:8px;font-size:var(--fs-xs);padding:2px 4px}}
.showmore{width:100%;border:0;background:none;color:var(--ink2);font-size:var(--fs-sm);font-weight:500;padding:8px;border-radius:10px}
.showmore:hover{background:var(--card)}
.tag{padding:2px 9px;border-radius:999px;font-size:var(--fs-xs);font-weight:500;background:hsl(var(--h) 70% 55% / .13);color:hsl(var(--h) 55% 34%);white-space:nowrap}
:root[data-theme="dark"] .tag{color:hsl(var(--h) 70% 75%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:hsl(var(--h) 70% 75%)}}
.pj{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:var(--fs-xs);font-weight:500;background:var(--soft2);color:var(--ink2);white-space:nowrap}
.pj::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc)}
.dp{font-size:var(--fs-xs);color:var(--ink2);background:none;box-shadow:inset 0 0 0 1px var(--line);padding:2px 9px;border-radius:999px;white-space:nowrap}

/* ===== Notes ===== */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.note{background:var(--card);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nc)}
.note.pin{background:linear-gradient(170deg,var(--ysoft),var(--card) 60%)}
.note .txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.note .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
.note .ft .sp{flex:1}
.note .ty{font-weight:600;color:var(--nc)}
.nform textarea{width:100%;border:1.5px solid transparent;background:var(--soft);border-radius:var(--r-md);padding:12px 14px;min-height:110px;resize:vertical;outline:none;line-height:1.5}
.nform textarea:focus{border-color:var(--yellow);background:var(--card)}
.nform .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.nform select{border:0;background:var(--soft);border-radius:999px;height:32px;padding:0 10px;max-width:170px;font-size:var(--fs-sm)}
.nform label{display:flex;gap:6px;align-items:center;font-size:var(--fs-sm);color:var(--ink2)}

/* ===== Rail ===== */
.rail{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;max-height:calc(100vh - 68px);min-height:0}
.cal{background:var(--yellow);border-radius:26px 26px 0 0;padding:18px 16px 32px;color:var(--on-yellow);flex:none}
.cal .chd{display:flex;align-items:center;gap:6px;margin:0 2px 10px}
.cal .chd h3{margin:0;font-size:var(--fs-xl);font-weight:600;flex:1}
.cal .chd h3 span{font-weight:400;opacity:.65}
.cal .chd button{border:0;background:rgba(255,255,255,.4);width:30px;height:30px;border-radius:10px;font-size:15px;color:var(--on-yellow)}
.cal .chd button:hover{background:rgba(255,255,255,.65)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg .wd{font-size:var(--fs-xs);opacity:.7;padding-bottom:4px}
.cd{border:0;background:none;height:36px;border-radius:11px;font-size:var(--fs-sm);font-weight:500;color:var(--on-yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.cd:hover{background:rgba(255,255,255,.35)}
.cd.out{opacity:.4}
.cd.ms::before{content:"";position:absolute;inset:3px;border-radius:9px;border:1.5px dashed rgba(31,42,68,.45)}
.cd.td{font-weight:700;background:rgba(255,255,255,.55)}
.cd.sel{background:var(--on-yellow);color:#fff}
.cd.sel::before{border-color:transparent}
.cd .dots{display:flex;gap:2px;height:4px}
.cd .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.callegend{display:flex;gap:12px;font-size:10.5px;margin:8px 4px 0;opacity:.8}
.callegend span{display:flex;gap:5px;align-items:center}
.callegend i{width:12px;height:12px;border-radius:4px;border:1.5px dashed rgba(31,42,68,.55)}
.callegend b{width:4px;height:4px;border-radius:50%;background:var(--on-yellow)}
.daily{background:var(--card);border-radius:24px;margin-top:-20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.daily .seg{box-shadow:none;background:var(--soft2);display:flex}
.daily .seg button{flex:1}
.dh{display:flex;align-items:center;gap:6px;padding:2px 4px 0;font-size:var(--fs-sm);color:var(--muted)}
.dh b{color:var(--ink);font-weight:600;font-size:var(--fs-md)}
.dh .sp{flex:1}
.dlist{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:60px;margin:0 -4px;padding:0 4px}
.dt{border-radius:14px;padding:10px 10px;display:flex;gap:10px;align-items:flex-start;background:var(--soft)}
.dt.done{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.dt.late{background:var(--soft);box-shadow:inset 3px 0 0 var(--bad)}
.dt .bd{flex:1;min-width:0}
.dt .bd b{font-weight:500;display:block;cursor:pointer;line-height:1.4}
.dt .bd b:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
.dt.done .bd b{text-decoration:line-through;color:var(--muted)}
.dt .meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center;font-size:var(--fs-xs);color:var(--ink2)}
.secl{font-size:var(--fs-xs);font-weight:600;color:var(--muted);padding:6px 4px 0}
.secl.bad{color:var(--bad)}
.qa{display:flex;gap:6px;background:var(--soft);border-radius:14px;padding:5px;border:1.5px solid transparent;flex:none}
.qa:focus-within{border-color:var(--yellow);background:var(--card)}
.qa input{flex:1;border:0;background:none;outline:none;padding:0 8px;min-width:0;height:32px}
.qa select{border:0;background:var(--card);border-radius:9px;padding:0 6px;max-width:112px;font-size:var(--fs-xs);height:32px;box-shadow:inset 0 0 0 1px var(--line)}
.qa button{border:0;background:var(--yellow);border-radius:10px;width:32px;height:32px;font-size:18px;color:var(--on-yellow);flex:none}
.hint{font-size:var(--fs-xs);color:var(--muted)}
.hint code{font-family:inherit;background:var(--soft2);border-radius:4px;padding:0 4px;color:var(--ink2)}
@media (max-width:1180px){
  .rail{position:static;max-height:none;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px}
  .cal{border-radius:24px;padding-bottom:16px}
  .daily{margin-top:0;max-height:440px}
}
@media (max-width:720px){
  .rail{display:flex;flex-direction:column;gap:0}
  .cal{border-radius:24px 24px 0 0;padding-bottom:30px}
  .cd{height:34px}
  .daily{margin-top:-20px;max-height:none}
  .dlist{overflow:visible}
}

/* ===== Manage ===== */
.mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.mg .full{grid-column:1/-1}
@container (max-width:820px){.mg{grid-template-columns:minmax(0,1fr)}}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mrow:first-of-type{border-top:0}
.mrow .nm{flex:1 1 200px;min-width:0}
.mrow .nm b{display:flex;align-items:center;gap:8px;font-weight:600}
.mrow .nm small{display:block;color:var(--muted);font-size:var(--fs-sm);margin-top:2px}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.ed{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0}
.ed input{flex:1;min-width:0;border:1.5px solid transparent;background:var(--soft);border-radius:var(--r-sm);height:36px;padding:0 10px;outline:none}
.ed input:hover{border-color:var(--line)}
.ed input:focus{border-color:var(--yellow);background:var(--card)}
.ed .n{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;min-width:56px;text-align:right}
.ed .sw2{width:10px;height:10px;border-radius:50%;background:var(--dc);flex:none}
.mtools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mtools select{border:0;background:var(--soft);border-radius:999px;height:34px;padding:0 12px;max-width:240px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:1.5px solid transparent;background:var(--soft);border-radius:var(--r-sm);height:36px;padding:0 10px;outline:none}
.addrow input:focus{border-color:var(--yellow);background:var(--card)}
.info{background:var(--soft);border-radius:var(--r-md);padding:14px 16px;font-size:var(--fs-sm);color:var(--ink2);line-height:1.6}
.info b{color:var(--ink)}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wsbtn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;height:26px;padding:0 10px 0 4px;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.wsbtn .av{width:20px;height:20px;font-size:9px}
.wsbtn::after{content:"▾";font-size:10px;color:var(--muted)}
/* ===== Login ===== */
.gate{position:fixed;inset:0;z-index:80;background:var(--page);display:grid;place-items:center;padding:20px}
.gate[hidden]{display:none}
.gcard{background:var(--card);border-radius:28px;padding:32px 28px;width:min(420px,100%);box-shadow:var(--shadow);text-align:center}
.gcard .bigic{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;background:var(--yellow);display:grid;place-content:center;font-size:32px}
.gcard h2{margin:0 0 6px;font-size:var(--fs-xl);font-weight:700}
.gcard p{margin:0 0 18px;color:var(--ink2);line-height:1.55}
.gcard input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;outline:none;background:var(--card);margin-bottom:10px}
.gcard input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--ysoft)}
.gcard .btn{width:100%}
.gmsg{margin-top:14px;font-size:var(--fs-sm);color:var(--ink2);min-height:1.5em}
.gmsg.err{color:var(--bad)}
.gcard code{background:var(--soft2);border-radius:6px;padding:1px 6px;font-size:var(--fs-sm)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.mem b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
/* ===== Welcome / dialog / toast ===== */
.welcome{text-align:center;padding:56px 24px}
.welcome .bigic{width:80px;height:80px;margin:0 auto 18px;border-radius:24px;background:var(--yellow);display:grid;place-content:center;font-size:38px}
.welcome h2{font-size:var(--fs-2xl);margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
.welcome p{color:var(--ink2);max-width:520px;margin:0 auto;line-height:1.6}
.welcome .r{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
dialog{border:0;border-radius:24px;padding:0;background:var(--card);color:var(--ink);width:min(560px,94vw);max-height:90vh;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(31,42,68,.35);backdrop-filter:blur(4px)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0 0 2px;font-size:var(--fs-xl);font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm);font-weight:500;color:var(--ink2)}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);background:var(--card);border-radius:12px;height:40px;padding:0 12px;font-weight:400;font-size:var(--fs-md);color:var(--ink);outline:none}
.fld textarea{height:auto;padding:10px 12px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--ysoft)}
.fld small{font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.f2{grid-template-columns:1fr}}
.swatches{display:flex;gap:10px}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.sw{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);cursor:pointer}
.swatches input:checked+.sw{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.swatches input:focus-visible+.sw{outline:2px solid var(--ink);outline-offset:4px}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.dlgfoot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;pointer-events:none;font-size:var(--fs-md)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media (max-width:720px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}

/* =====================================================================
   GIAO DIỆN TRONG SUỐT (glass) – chỉ thay lớp hiển thị, không đụng dữ liệu
   ===================================================================== */
:root{
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.7); --glass-soft:rgba(255,255,255,.26);
  --glass-edge:rgba(255,255,255,.75); --glass-blur:saturate(180%) blur(22px);
  --soft:rgba(255,255,255,.5); --soft2:rgba(31,42,68,.07); --line:rgba(31,42,68,.09);
  --heat0:rgba(31,42,68,.06);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px -14px rgba(60,40,10,.28);
  --bg1:#FFD36E; --bg2:#FFAE8C; --bg3:#C4B2FF; --bg4:#9EE2D4; --bgbase:#F7EFE3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(34,30,44,.5); --glass-strong:rgba(30,27,40,.78); --glass-soft:rgba(255,255,255,.06);
  --glass-edge:rgba(255,255,255,.12);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.08); --line:rgba(255,255,255,.09); --heat0:rgba(255,255,255,.06);
  --shadow:0 1px 0 rgba(255,255,255,.06) inset,0 14px 34px -14px rgba(0,0,0,.7);
  --bg1:#5A3E10; --bg2:#5A2638; --bg3:#2D2466; --bg4:#0F4A44; --bgbase:#0F0D14;
}}
:root[data-theme="dark"]{
  --glass:rgba(34,30,44,.5); --glass-strong:rgba(30,27,40,.78); --glass-soft:rgba(255,255,255,.06);
  --glass-edge:rgba(255,255,255,.12);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.08); --line:rgba(255,255,255,.09); --heat0:rgba(255,255,255,.06);
  --shadow:0 1px 0 rgba(255,255,255,.06) inset,0 14px 34px -14px rgba(0,0,0,.7);
  --bg1:#5A3E10; --bg2:#5A2638; --bg3:#2D2466; --bg4:#0F4A44; --bgbase:#0F0D14;
}

/* Nền: các mảng màu mềm để lớp kính có thứ để “nhìn xuyên” */
body{background:var(--bgbase)}
body::after{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(45% 50% at 10% 15%,var(--bg1),transparent 72%),
    radial-gradient(40% 46% at 90% 10%,var(--bg3),transparent 72%),
    radial-gradient(46% 50% at 80% 90%,var(--bg2),transparent 72%),
    radial-gradient(42% 46% at 15% 95%,var(--bg4),transparent 72%),
    radial-gradient(30% 34% at 52% 50%,var(--bg1),transparent 75%);
  filter:blur(30px)}

/* Bề mặt kính */
.shell{background:rgba(255,255,255,.12);border:1px solid var(--glass-edge);box-shadow:0 30px 80px -40px rgba(60,40,10,.35)}
.card,.side,.tile,.daily,.note,.seg,.search,.sc,.btn:not(.y):not(.danger):not(.line),.filters select,.toast,.wsbtn{
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
.sc.on,.seg button.on,.tab.on{background:var(--ink);color:var(--card);border-color:transparent}
.sc.add{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:1px dashed var(--line);box-shadow:none}
.btn.line{background:var(--glass-soft);border:1px solid var(--line);box-shadow:none}
.btn.y{background:linear-gradient(180deg,#FFCB52,#F7B52C);border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 18px -8px rgba(230,150,0,.6)}
.nv.on{background:rgba(247,181,44,.28);box-shadow:0 0 0 1px rgba(247,181,44,.45) inset}
.nv:hover{background:var(--glass-soft)}
.logo{box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 18px -8px rgba(230,150,0,.7)}

/* Thẻ việc trong bảng: kính nhẹ, không làm mờ (nhẹ máy khi nhiều thẻ) */
.col{background:var(--glass-soft);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.col.over{background:rgba(247,181,44,.18)}
.kc{background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 16px -10px rgba(60,40,10,.35)}
.kc.done{background:var(--glass-soft);box-shadow:none}
.mini{background:linear-gradient(150deg,rgba(255,226,150,.55),rgba(255,210,120,.3));border:1px solid var(--glass-edge)}
.dt{background:var(--glass-soft);border:1px solid var(--glass-edge)}
.dt.done{background:transparent;border-color:var(--line);box-shadow:none}
.dt.late{background:rgba(217,68,58,.08)}
.empty{background:var(--glass-soft)}

/* Lịch vàng: kính màu */
.cal{background:linear-gradient(160deg,rgba(255,206,92,.9),rgba(247,175,30,.82));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 14px 34px -16px rgba(200,130,0,.6)}
.daily{border-top:1px solid var(--glass-edge)}

/* Timeline */
.glab{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.gbg{background:var(--glass-soft);border:1px solid var(--glass-edge)}
.gbar{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 14px -8px var(--bc)}
.gh.today{background:var(--glass)}

/* Ô nhập và hộp thoại */
.fld input,.fld select,.fld textarea{background:var(--glass-strong);border-color:var(--line)}
dialog{background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--glass-edge)}
dialog::backdrop{background:rgba(31,42,68,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gate{background:transparent}
.gcard{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge)}
.toast{background:rgba(31,42,68,.82);color:#fff}
.av{box-shadow:0 0 0 2px rgba(255,255,255,.75)}

/* Trình duyệt không hỗ trợ làm mờ, hoặc người dùng bật “Giảm độ trong suốt”: dùng nền đặc để chữ luôn dễ đọc */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.side,.tile,.daily,.note,.seg,.search,.sc,.filters select,.glab,dialog,.gcard{background:var(--frame)}
}
@media (prefers-reduced-transparency:reduce){
  .card,.side,.tile,.daily,.note,.seg,.search,.sc,.filters select,.glab,dialog,.gcard,.kc{background:var(--frame);-webkit-backdrop-filter:none;backdrop-filter:none}
  body::after{display:none}
}

/* Timeline – cột tên: một dải kính liền mạch, khớp với thẻ chung */
:root{--tl-col:rgba(255,252,246,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tl-col:rgba(32,28,42,.86)}}
:root[data-theme="dark"]{--tl-col:rgba(32,28,42,.86)}
.gr>.glab,.gr>.gsec{background:var(--tl-col);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);box-shadow:inset -1px 0 0 var(--line)}
.gr>.gsec{grid-column:1/2;margin:0;padding:16px 14px 4px 10px;letter-spacing:.01em}
.glab{padding-left:10px}
.ghead>.glab{border-radius:16px 0 0 0;align-items:flex-end;padding-bottom:10px}
.gbody>.gr:last-of-type>.glab{border-radius:0 0 0 16px}
.gh.today{background:var(--tl-col);box-shadow:inset 0 1px 0 var(--glass-edge)}
@media (max-width:600px){.gantt{--lw:150px}.glab .av{display:none}.gin{min-width:1150px}}
.ghead>.glab{background:color-mix(in srgb,var(--frame) 94%,transparent)}
@media (prefers-reduced-transparency:reduce){.gr>.glab,.gr>.gsec{background:var(--frame);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>

<script>
(function(){
"use strict";
const LS="launch-tracker-v1";
const COLORS=["#3DB5AE","#9B6FF2","#F2A11F","#F26B4F","#4F86EC","#E05F9C"];
const OLDC={"#2F6BAA":"#4F86EC","#2B8A57":"#3DB5AE","#B0457F":"#E05F9C","#D27A21":"#F2A11F","#6A5BC8":"#9B6FF2","#1C8A8A":"#3DB5AE","#7B5CFF":"#9B6FF2","#FF3D8B":"#E05F9C","#13C08F":"#3DB5AE","#FF8A1F":"#F26B4F","#2E9BF0":"#4F86EC","#E5B800":"#F2A11F","#43BFB8":"#3DB5AE","#A97CF8":"#9B6FF2","#F7A52C":"#F2A11F","#FF7A59":"#F26B4F","#5B8DEF":"#4F86EC","#EC6FA6":"#E05F9C"};
const STATUS={todo:"Chưa làm",doing:"Đang làm",blocked:"Bị chặn",done:"Xong"};
const SCOL={todo:"#A79F8C",doing:"#F2A11F",blocked:"#D9443A",done:"#24935F"};
const PRIO={3:"Cao",2:"Vừa",1:"Thấp"};
const NOTETYPE={key:["Điểm chính","#E0920A"],decision:["Quyết định","#4F86EC"],risk:["Rủi ro","#D9443A"],idea:["Ý tưởng","#2FA59E"]};
const WD=["CN","T2","T3","T4","T5","T6","T7"];
const I={
  dash:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
  timeline:'<svg viewBox="0 0 24 24"><path d="M4 6.5h9M8 12h12M5 17.5h8"/></svg>',
  board:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="5" height="16" rx="1.6"/><rect x="10.5" y="4" width="5" height="10" rx="1.6"/><rect x="17.5" y="4" width="3.5" height="13" rx="1.4"/></svg>',
  notes:'<svg viewBox="0 0 24 24"><path d="M6 3.5h8.5l4 4V20.5H6z"/><path d="M14 3.5v4.5h4.5M9 12.5h6.5M9 16.5h4.5"/></svg>',
  manage:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  theme:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
const VIEWS=[["dash","Tổng quan"],["timeline","Timeline"],["board","Bảng việc"],["notes","Ghi chú"],["manage","Quản lý"]];

let state={projects:[],tasks:[],notes:[]};
const ui={view:"dash",scope:"all",day:iso(new Date()),calM:null,railTab:"day",range:"all",gStart:null,q:"",f:{tag:"",owner:"",dept:""},doneAll:false};

/* dates */
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parse(s){if(!s)return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function today(){return iso(new Date())}
function fmt(s){if(!s)return"";const d=parse(s);return WD[d.getDay()]+", "+d.getDate()+"/"+(d.getMonth()+1)}
function fmtS(s){if(!s)return"";const d=parse(s);return d.getDate()+"/"+(d.getMonth()+1)}
function monday(s){const d=parse(s);return addDays(s,-((d.getDay()+6)%7))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function rel(s){const n=diff(today(),s);if(n===0)return"Hôm nay";if(n===1)return"Ngày mai";if(n===-1)return"Trễ 1 ngày";if(n<0)return"Trễ "+(-n)+" ngày";if(n<7)return fmt(s);return fmtS(s)}

/* utils */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function ini(n){const p=String(n).trim().split(/\s+/);return (p[p.length-1]||"?").slice(0,2).toUpperCase()}
function proj(id){return state.projects.find(p=>p.id===id)}
function av(n){return n?`<span class="av" style="--h:${hue(n)}" title="${esc(n)}">${esc(ini(n))}</span>`:`<span class="av none" title="Chưa giao">?</span>`}
function tagH(t){return `<span class="tag" style="--h:${hue(t)}">#${esc(t)}</span>`}
function pjH(p){return p?`<span class="pj" style="--pc:${p.color}">${esc(p.name)}</span>`:""}
function owners(){return [...new Set(state.tasks.map(t=>t.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"vi"))}
function tagsAll(){return [...new Set(state.tasks.flatMap(t=>t.tags||[]))].sort((a,b)=>a.localeCompare(b,"vi"))}
function AP(){return state.projects.filter(p=>!p.done)}
function scoped(){return ui.scope==="all"?AP():AP().filter(p=>p.id===ui.scope)}
function inScope(t){const p=proj(t.projectId);if(!p||p.done)return false;return ui.scope==="all"||t.projectId===ui.scope}
function matchQ(t){if(!ui.q)return true;const q=ui.q.toLowerCase();return [t.title,t.owner,t.dept,(t.tags||[]).join(" "),t.detail,proj(t.projectId)?.name].join(" ").toLowerCase().includes(q)}
function scTasks(){return state.tasks.filter(t=>!t.archived&&inScope(t)&&matchQ(t))}
function dayOf(t){return t.day||t.due||""}
function task(id){return state.tasks.find(t=>t.id===id)}

/* stats */
function tasksOf(pid){return state.tasks.filter(t=>t.projectId===pid&&!t.archived)}
function isLate(t){return t.status!=="done"&&t.due&&t.due<today()}
function pstats(p){
  const ts=tasksOf(p.id),total=ts.length,done=ts.filter(t=>t.status==="done").length;
  const work=total?Math.round(done/total*100):0,span=Math.max(1,diff(p.start,p.launch));
  const time=Math.round(clamp(diff(p.start,today())/span*100,0,100));
  const left=diff(today(),p.launch),late=ts.filter(isLate).length,blocked=ts.filter(t=>t.status==="blocked").length;
  let h;
  if(left<0)h=["Đã launch","mute","launched"];
  else if(!total)h=["Chưa có việc","mute","none"];
  else if(work>=time-10&&late<=2)h=["Đúng tiến độ","ok","ok"];
  else if(work>=time-25)h=["Cần chú ý","warn","warn"];
  else h=["Đang chậm","bad","bad"];
  return {total,done,work,time,left,late,blocked,h};
}
function deptColor(p,d){const i=(p.departments||[]).indexOf(d);return i<0?"#A79F8C":COLORS[i%COLORS.length]}
function deptStats(p){return (p.departments||[]).map(d=>{const ts=tasksOf(p.id).filter(t=>t.dept===d),done=ts.filter(t=>t.status==="done").length;return {d,total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0,late:ts.filter(isLate).length}})}
function setStatus(t,s){t.status=s;if(s==="done")t.doneDate=t.doneDate||today();else delete t.doneDate}

/* storage – Supabase, nhiều không gian làm việc */
const CFG=window.APP_CONFIG||{};
let sb=null,session=null,me=null,ws=null,wsList=[],members=[],dirty=false,writing=false,pending=false,saveTimer=null,retryT=null,mode="connecting",channel=null;
const synced={projects:new Map(),tasks:new Map(),notes:new Map()};
const LSK=()=>LS+(ws?"-"+ws:"");
function setSave(k,t){const el=$("saveSt");el.className="save "+k;el.querySelector("span").textContent=t}
function normalize(s){const ps=Array.isArray(s?.projects)?s.projects:[];ps.forEach(p=>{if(OLDC[p.color])p.color=OLDC[p.color];p.milestones=p.milestones||[];p.departments=p.departments||[]});return {projects:ps,tasks:Array.isArray(s?.tasks)?s.tasks:[],notes:Array.isArray(s?.notes)?s.notes:[]}}
function loadLocal(){if(!ws)return;try{const r=localStorage.getItem(LSK());state=r?normalize(JSON.parse(r)):{projects:[],tasks:[],notes:[]}}catch(e){}}
function saveLocal(){if(!ws)return;try{localStorage.setItem(LSK(),JSON.stringify(state))}catch(e){}}
const MAP={
  projects:{to:p=>({workspace_id:ws,id:p.id,name:p.name,color:p.color,start_date:p.start||null,launch_date:p.launch||null,departments:p.departments||[],milestones:p.milestones||[],done:!!p.done,done_at:p.doneAt||null}),
    from:r=>({id:r.id,name:r.name,color:r.color,start:r.start_date||"",launch:r.launch_date||"",departments:r.departments||[],milestones:r.milestones||[],...(r.done?{done:true}:{}),...(r.done_at?{doneAt:r.done_at}:{})})},
  tasks:{to:t=>({workspace_id:ws,id:t.id,project_id:t.projectId,title:t.title,dept:t.dept||"",tags:t.tags||[],owner:t.owner||"",day:t.day||null,due:t.due||null,status:t.status||"todo",priority:Number(t.priority)||2,detail:t.detail||"",done_date:t.doneDate||null,archived:!!t.archived,created:Number(t.created)||0}),
    from:r=>({id:r.id,projectId:r.project_id,title:r.title,dept:r.dept||"",tags:r.tags||[],owner:r.owner||"",day:r.day||"",due:r.due||"",status:r.status,priority:r.priority||2,detail:r.detail||"",created:Number(r.created)||0,...(r.done_date?{doneDate:r.done_date}:{}),...(r.archived?{archived:true}:{})})},
  notes:{to:n=>({workspace_id:ws,id:n.id,project_id:n.projectId,text:n.text,type:n.type||"key",pinned:!!n.pinned,date:n.date||null,created:Number(n.created)||0}),
    from:r=>({id:r.id,projectId:r.project_id,text:r.text,type:r.type||"key",pinned:!!r.pinned,date:r.date||"",created:Number(r.created)||0})}
};
const KINDS=["projects","tasks","notes"];
const rowStr=(k,o)=>JSON.stringify(MAP[k].to(o));
async function fetchAll(table){let out=[],from=0;for(;;){const{data,error}=await sb.from(table).select("*").eq("workspace_id",ws).order("id").range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function flush(){
  saveLocal();
  if(!sb||!session||!ws||mode!=="db"){setSave("","Chưa đồng bộ – lưu tạm trên trình duyệt");return}
  if(writing){pending=true;return}
  writing=true;setSave("busy","Đang lưu…");clearTimeout(retryT);
  const W=ws;
  try{
    const plan={};
    for(const k of KINDS){const cur=new Map(state[k].map(o=>[o.id,rowStr(k,o)]));const ups=[],dels=[];
      cur.forEach((s,id)=>{if(synced[k].get(id)!==s)ups.push([id,s])});synced[k].forEach((_,id)=>{if(!cur.has(id))dels.push(id)});plan[k]={ups,dels}}
    for(const k of KINDS){const u=plan[k].ups;for(let i=0;i<u.length;i+=400){const chunk=u.slice(i,i+400);const{error}=await sb.from(k).upsert(chunk.map(x=>JSON.parse(x[1])),{onConflict:"workspace_id,id"});if(error)throw error;if(ws!==W)return;chunk.forEach(([id,s])=>synced[k].set(id,s))}}
    for(const k of ["notes","tasks","projects"]){const d=plan[k].dels;for(let i=0;i<d.length;i+=200){const chunk=d.slice(i,i+200);const{error}=await sb.from(k).delete().eq("workspace_id",W).in("id",chunk);if(error)throw error;if(ws!==W)return;chunk.forEach(id=>synced[k].delete(id))}}
    setSave("ok","Đã lưu");
  }catch(e){console.error(e);setSave("err","Chưa lưu được – sẽ thử lại");retryT=setTimeout(flush,6000)}
  finally{writing=false}
  if(pending){pending=false;flush()}
}
function persist(){dirty=true;saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dirty=false;flush()},500);render()}
let rrT=null,pendingRender=false;
function applyRemote(k,ev,row){
  const id=(row&&row.id);if(!id||(row.workspace_id&&row.workspace_id!==ws))return;
  const idx=state[k].findIndex(o=>o.id===id),local=idx>=0?rowStr(k,state[k][idx]):undefined;
  if(local!==synced[k].get(id))return;
  if(ev==="DELETE"){if(idx>=0)state[k].splice(idx,1);synced[k].delete(id)}
  else{const o=MAP[k].from(row);if(k==="projects")normalize({projects:[o]});const s=rowStr(k,o);if(s===local)return;if(idx>=0)state[k][idx]=o;else state[k].push(o);synced[k].set(id,s)}
  saveLocal();clearTimeout(rrT);rrT=setTimeout(()=>{if(!dlg.open)render();else pendingRender=true},150);
}
async function loadMembers(){const r=await sb.from("workspace_members").select("email,role").eq("workspace_id",ws).order("email");members=r.data||[]}
async function loadRemote(){
  setSave("busy","Đang tải dữ liệu…");
  const [ps,ts,ns]=await Promise.all([fetchAll("projects"),fetchAll("tasks"),fetchAll("notes"),loadMembers()]);
  KINDS.forEach(k=>synced[k].clear());
  const local=state;
  state=normalize({projects:ps.map(MAP.projects.from),tasks:ts.map(MAP.tasks.from),notes:ns.map(MAP.notes.from)});
  KINDS.forEach(k=>state[k].forEach(o=>synced[k].set(o.id,rowStr(k,o))));
  mode="db";
  if(!ps.length&&local.projects.length){state=normalize(local);await flush()}else{saveLocal();setSave("ok","Đã đồng bộ")}
  render();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("ws-"+ws);
  const f="workspace_id=eq."+ws;
  KINDS.forEach(k=>channel.on("postgres_changes",{event:"*",schema:"public",table:k,filter:f},p=>applyRemote(k,p.eventType,p.eventType==="DELETE"?p.old:p.new)));
  channel.on("postgres_changes",{event:"*",schema:"public",table:"workspace_members",filter:f},async()=>{await loadMembers();if(ui.view==="manage")render()});
  channel.subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setSave("err","Mất kết nối realtime – đang thử lại")});
}

function arcGauge(p){
  const cx=100,cy=92,r=74,path=`M${(cx+r*Math.cos(Math.PI*.75)).toFixed(1)} ${(cy+r*Math.sin(Math.PI*.75)).toFixed(1)} A${r} ${r} 0 1 1 ${(cx+r*Math.cos(Math.PI*.25)).toFixed(1)} ${(cy+r*Math.sin(Math.PI*.25)).toFixed(1)}`;
  const a=(135+270*p)*Math.PI/180,kx=cx+r*Math.cos(a),ky=cy+r*Math.sin(a);
  return `<svg viewBox="0 0 200 170" width="200" height="170" aria-hidden="true">
    <defs><linearGradient id="gy" x1="0" x2="1"><stop offset="0" stop-color="#FFD873"/><stop offset="1" stop-color="#F7B52C"/></linearGradient></defs>
    <path d="${path}" fill="none" stroke="var(--soft2)" stroke-width="14" stroke-linecap="round"/>
    ${p>0?`<path d="${path}" fill="none" stroke="url(#gy)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${(p*100).toFixed(1)} 200"/><circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="9" fill="var(--card)" stroke="#F7B52C" stroke-width="5"/>`:""}</svg>`;
}
function tickGauge(p){
  const n=31,cx=120,cy=116;let s="";
  for(let i=0;i<n;i++){const t=i/(n-1),a=Math.PI*(1-t),r1=86,r2=106,on=p>0&&t<=p+1e-9;
    s+=`<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy-r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy-r2*Math.sin(a)).toFixed(1)}" stroke="${on?"#F7B52C":"var(--soft2)"}" stroke-width="4.5" stroke-linecap="round"/>`}
  return `<svg viewBox="0 0 240 122" width="100%" aria-hidden="true">${s}</svg>`;
}

/* ===== timeline ===== */
function gWindow(){

function board(){

  const card=(t,k)=>{const pp=proj(t.projectId),late=isLate(t);return `<article class="kc ${k==="done"?"done":""}" draggable="true" data-id="${t.id}">
      <div class="h"><b data-act="editTask" data-id="${t.id}">${esc(t.title)}</b><button class="more" data-act="editTask" data-id="${t.id}" aria-label="Sửa việc">⋯</button></div>
      ${t.detail&&k!=="done"?`<p>${esc(t.detail)}</p>`:""}
      <div class="tags">${!p?pjH(pp):""}${t.dept?`<span class="dp">${esc(t.dept)}</span>`:""}${k!=="done"?(t.tags||[]).map(tagH).join(""):""}</div>
      <div class="ft">${k!=="done"?`<span class="pri p${t.priority||2}">${PRIO[t.priority||2]}</span>`:""}<select data-act="status" data-id="${t.id}" aria-label="Trạng thái">${Object.entries(STATUS).map(([s,l])=>`<option value="${s}" ${t.status===s?"selected":""}>${l}</option>`).join("")}</select><span class="sp"></span>${k==="done"?`<span>Xong ${fmtS(t.doneDate||t.due)}</span>`:t.due?`<span class="${late?"late":""}">${late?rel(t.due):"Hạn "+fmtS(t.due)}</span>`:""}${av(t.owner)}</div></article>`};
  const col=k=>{let ts=list.filter(t=>t.status===k);
    ts=k==="done"?ts.sort((a,b)=>(b.doneDate||b.due||"").localeCompare(a.doneDate||a.due||"")):ts.sort((a,b)=>(isLate(b)-isLate(a))||(b.priority||2)-(a.priority||2)||(a.due||dayOf(a)||"9").localeCompare(b.due||dayOf(b)||"9"));
    const total=ts.length,lim=k==="done"&&!ui.doneAll?6:999,shown=ts.slice(0,lim);
    return `<section class="col" data-col="${k}" aria-label="${STATUS[k]}"><div class="colh"><i style="background:${SCOL[k]}"></i>${STATUS[k]}<span class="cnt">${total}</span><span class="sp"></span>${k!=="done"?`<button class="more" data-act="newTask" data-status="${k}" data-pid="${p?p.id:""}" aria-label="Thêm việc vào cột ${STATUS[k]}">+</button>`:""}</div>

function wireDnD(){

function noteCard(n){

  return `<article class="note ${n.pinned?"pin":""}" style="--nc:${ty[1]}"><div class="ft"><span class="ty">${ty[0]}</span>${ui.scope==="all"&&p?pjH(p):""}<span class="sp"></span>
    <button class="more" data-act="pin" data-id="${n.id}" aria-pressed="${!!n.pinned}" aria-label="${n.pinned?"Bỏ ghim":"Ghim ghi chú"}" title="${n.pinned?"Bỏ ghim":"Ghim"}" style="${n.pinned?"color:var(--yellow)":""}">${n.pinned?"★":"☆"}</button><button class="more" data-act="delNote" data-id="${n.id}" aria-label="Xóa ghi chú">×</button></div>
    <div class="txt">${esc(n.text)}</div><div class="ft">${fmt(n.date)}</div></article>`;
}
function notes(){
  const q=ui.q.toLowerCase();
  const list=state.notes.filter(n=>{const p=proj(n.projectId);return p&&!p.done}).filter(n=>(ui.scope==="all"||n.projectId===ui.scope)&&(!q||n.text.toLowerCase().includes(q))).sort((a,b)=>(b.pinned-a.pinned)||b.created-a.created);
  return `<div class="notes"><div class="card nform"><div class="ch"><h3>Ghi nhanh</h3></div><textarea id="noteTxt" placeholder="Ví dụ: Chốt giá bán 299k, không chạy khuyến mãi tuần đầu" aria-label="Nội dung ghi chú"></textarea>
    <div class="r">${ui.scope==="all"?`<select id="noteProj" aria-label="Dự án">${AP().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`:""}
    <select id="noteType" aria-label="Loại ghi chú">${Object.entries(NOTETYPE).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select>
    <label><input type="checkbox" class="chk" id="notePin"> Ghim</label><span style="flex:1"></span><button class="btn y sm" data-act="addNote">Lưu ghi chú</button></div>
    <div class="hint" style="margin-top:8px">Mẹo: nhấn <code>Ctrl</code> + <code>Enter</code> để lưu nhanh.</div></div>
    ${list.map(noteCard).join("")}</div>${list.length?"":`<p class="muted" style="margin-top:14px">Chưa có ghi chú. Ghi lại quyết định, rủi ro hay điểm cần nhớ để cả nhóm cùng nắm.</p>`}`;
}

/* ===== manage ===== */

  const act=AP().sort((a,b)=>a.launch.localeCompare(b.launch)),done=state.projects.filter(p=>p.done).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  if(!ui.mgP||!proj(ui.mgP))ui.mgP=(act[0]||done[0]||{}).id;
  const mp=proj(ui.mgP);
  const prow=(p,isDone)=>{const s=pstats(p);return `<div class="mrow"><div class="nm"><b><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}${isDone?'<span class="pill ok">Đã hoàn thành</span>':`<span class="pill ${s.h[1]}">${s.h[0]}</span>`}</b>
    <small>${fmtS(p.start)} → ${fmt(p.launch)} · ${s.done}/${s.total} việc xong${isDone&&p.doneAt?" · hoàn thành "+fmt(p.doneAt):""} · ${state.notes.filter(n=>n.projectId===p.id).length} ghi chú</small></div>
    <div class="acts">${isDone?`<button class="btn sm line" data-act="restoreP" data-id="${p.id}">Khôi phục</button>`:`<button class="btn sm line" data-act="editProject" data-id="${p.id}">Sửa</button><button class="btn sm line" data-act="completeP" data-id="${p.id}">✓ Hoàn thành</button>`}<button class="btn sm danger" data-act="deleteP" data-id="${p.id}">Xóa</button></div></div>`};
  const tagC={};state.tasks.forEach(t=>(t.tags||[]).forEach(g=>tagC[g]=(tagC[g]||0)+1));
  const ownC={};state.tasks.forEach(t=>{if(t.owner)ownC[t.owner]=(ownC[t.owner]||0)+1});
