  <section class="card full"><div class="ch"><h3>Đã hoàn thành</h3><span class="cnt">${done.length} · ẩn khỏi bảng tổng, dữ liệu vẫn được giữ</span></div>
    ${done.length?done.map(p=>prow(p,true)).join(""):`<div class="empty">Chưa có dự án nào hoàn thành. Bấm “✓ Hoàn thành” khi dự án đã launch xong để dọn gọn bảng tổng.</div>`}</section>
  <section class="card"><div class="ch"><h3>Bộ phận</h3></div>
    ${mp?`<div class="mtools"><select data-act="mgP" aria-label="Chọn dự án">${state.projects.map(p=>`<option value="${p.id}" ${p.id===mp.id?"selected":""}>${esc(p.name)}${p.done?" (đã xong)":""}</option>`).join("")}</select><span class="hint">Sửa tên rồi nhấn Enter. Các việc đã gắn sẽ đổi theo.</span></div>
    ${mp.departments.map((d,i)=>`<div class="ed"><span class="sw2" style="--dc:${deptColor(mp,d)}"></span><input value="${esc(d)}" data-ren="dept" data-old="${esc(d)}" aria-label="Tên bộ phận ${esc(d)}"><span class="n">${deptC(d)} việc</span><button class="more" data-act="deptMove" data-v="${i}" data-dir="-1" aria-label="Chuyển lên" ${i?"":"disabled style='opacity:.3'"}>↑</button><button class="more" data-act="deptDel" data-v="${esc(d)}" aria-label="Xóa bộ phận ${esc(d)}">×</button></div>`).join("")||`<div class="empty">Dự án chưa có bộ phận.</div>`}
    <div class="addrow"><input id="newDept" placeholder="Thêm bộ phận mới" aria-label="Tên bộ phận mới"><button class="btn sm y" data-act="deptAdd">Thêm</button></div>`:`<div class="empty">Chưa có dự án.</div>`}</section>
  <section class="card"><div class="ch"><h3>Tag</h3><span class="cnt">${tags.length}</span></div>
    <div class="hint" style="margin-bottom:8px">Đổi tên trùng với tag có sẵn sẽ gộp hai tag lại.</div>
    ${tags.map(g=>`<div class="ed"><span class="tag" style="--h:${hue(g)}">#</span><input value="${esc(g)}" data-ren="tag" data-old="${esc(g)}" aria-label="Tag ${esc(g)}"><span class="n">${tagC[g]} việc</span><button class="more" data-act="tagDel" data-v="${esc(g)}" aria-label="Xóa tag ${esc(g)}">×</button></div>`).join("")||`<div class="empty">Chưa có tag nào.</div>`}</section>
  <section class="card"><div class="ch"><h3>Người phụ trách</h3><span class="cnt">${ows.length}</span></div>
    <div class="hint" style="margin-bottom:8px">Đổi tên để sửa chính tả, hoặc nhập trùng tên người khác để gộp.</div>
    ${ows.map(o=>`<div class="ed">${av(o)}<input value="${esc(o)}" data-ren="owner" data-old="${esc(o)}" aria-label="Người phụ trách ${esc(o)}"><span class="n">${ownC[o]} việc</span></div>`).join("")||`<div class="empty">Chưa giao việc cho ai.</div>`}</section>
  <section class="card"><div class="ch"><h3>Sao lưu dữ liệu</h3></div>
    <div class="info">Dữ liệu được lưu trong <b>cơ sở dữ liệu Supabase</b> của bạn và đồng bộ trực tiếp giữa mọi người trong nhóm. Trình duyệt giữ thêm một bản sao để mở nhanh và dùng tạm khi mất mạng.<br>Supabase gói miễn phí không tự sao lưu, nên hãy <b>xuất file</b> định kỳ (ví dụ mỗi tuần).</div>
    <div class="bk"><button class="btn sm y" data-act="exportData">Xuất file sao lưu (.json)</button><button class="btn sm line" data-act="importFile">Nhập từ file…</button></div>
    <div class="hint" style="margin-top:10px">${state.projects.length} dự án · ${state.tasks.length} việc · ${state.notes.length} ghi chú</div></section>
  <section class="card"><div class="ch"><h3>Thành viên của “${esc(curWs()?.name||"")}”</h3><span class="cnt">${members.length}</span></div>
    <div class="hint" style="margin-bottom:8px">Chỉ những người trong danh sách này thấy được dự án của không gian này. Người khác dùng cùng đường link sẽ có không gian riêng của họ.${isAdmin()?"":" Chỉ chủ sở hữu mới thêm hoặc xóa được thành viên."}</div>
    ${members.map(m=>`<div class="mem">${av(m.email.split("@")[0])}<b title="${esc(m.email)}">${esc(m.email)}${m.email===me?" (bạn)":""}</b><span class="pill ${m.role==="owner"?"warn":"mute"}">${m.role==="owner"?"Chủ sở hữu":"Thành viên"}</span>${isAdmin()&&m.email!==me?`<button class="more" data-act="memDel" data-v="${esc(m.email)}" aria-label="Xóa ${esc(m.email)}">×</button>`:""}</div>`).join("")}
    ${isAdmin()?`<div class="addrow"><input id="newMem" type="email" placeholder="email@congty.com" aria-label="Email thành viên mới"><select id="newMemRole" aria-label="Vai trò" style="border:0;background:var(--soft);border-radius:10px;padding:0 8px"><option value="editor">Thành viên</option><option value="owner">Chủ sở hữu</option></select><button class="btn sm y" data-act="memAdd">Thêm</button></div>
    <div class="ed" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><input value="${esc(curWs()?.name||"")}" id="wsRename" aria-label="Tên không gian"><button class="btn sm line" data-act="wsRename">Đổi tên</button></div>`:""}</section>
  <section class="card"><div class="ch"><h3>Tài khoản</h3></div><div class="mem">${av((me||"?").split("@")[0])}<b>${esc(me||"")}</b><button class="btn sm line" data-act="wsSwitch">Không gian khác</button><button class="btn sm line" data-act="logout">Đăng xuất</button></div></section>
  </div>`;
}
function completeProject(id){const p=proj(id);snapshotUndo(`Đã chuyển “${p.name}” vào mục Đã hoàn thành`);p.done=true;p.doneAt=today();if(ui.scope===id)ui.scope="all";persist()}
function deleteProject(id){const p=proj(id),n=tasksOf(id).length;if(!confirm(`Xóa vĩnh viễn dự án “${p.name}” cùng ${n} việc và các ghi chú? Bạn có 5 giây để hoàn tác.`))return;
  snapshotUndo(`Đã xóa dự án “${p.name}”`);state.tasks=state.tasks.filter(t=>t.projectId!==id);state.notes=state.notes.filter(x=>x.projectId!==id);state.projects=state.projects.filter(x=>x.id!==id);if(ui.scope===id)ui.scope="all";persist()}
function renameAll(kind,oldV,newV){
  newV=String(newV).trim();if(kind==="tag")newV=newV.replace(/^#/,"");
  if(!newV||newV===oldV){render();return}
  let n=0;
  if(kind==="dept"){const p=proj(ui.mgP);if(p.departments.includes(newV)){p.departments=p.departments.filter(d=>d!==oldV)}else p.departments=p.departments.map(d=>d===oldV?newV:d);
    state.tasks.forEach(t=>{if(t.projectId===p.id&&t.dept===oldV){t.dept=newV;n++}});if(ui.f.dept===oldV)ui.f.dept=newV}
  else if(kind==="tag"){state.tasks.forEach(t=>{if((t.tags||[]).includes(oldV)){t.tags=[...new Set(t.tags.map(g=>g===oldV?newV:g))];n++}});if(ui.f.tag===oldV)ui.f.tag=newV}
  else if(kind==="owner"){state.tasks.forEach(t=>{if(t.owner===oldV){t.owner=newV;n++}});if(ui.f.owner===oldV)ui.f.owner=newV}
  persist();toast(`Đã đổi “${oldV}” thành “${newV}” (${n} việc)`);
}
function exportData(){
  const json=JSON.stringify({app:"launch-tracker",version:1,exportedAt:new Date().toISOString(),state},null,2);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=`launch-tracker-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Đã tải file sao lưu");
}
function importFile(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  try{const d=JSON.parse(r.result),s=d.state||d;if(!Array.isArray(s.projects)||!Array.isArray(s.tasks))throw 0;
    if(state.projects.length&&!confirm(`Thay toàn bộ dữ liệu hiện tại bằng file này (${s.projects.length} dự án, ${s.tasks.length} việc)? Bạn có 5 giây để hoàn tác.`))return;
    snapshotUndo("Đã nhập dữ liệu từ file");state=normalize(s);ui.scope="all";persist()}catch(_){alert("File không đúng định dạng sao lưu của trang này.")}};r.readAsText(f)};inp.click()}

/* ===== rail ===== */
function renderRail(){
  const T=today();if(!ui.calM)ui.calM=ui.day.slice(0,7)+"-01";
  const m0=ui.calM,first=monday(m0),mo=parse(m0).getMonth();
  const tdays={};state.tasks.filter(t=>inScope(t)&&t.status!=="done").forEach(t=>{const d=dayOf(t);if(d)tdays[d]=(tdays[d]||0)+1});
  const msd={};scoped().forEach(p=>{p.milestones.forEach(m=>msd[m.date]=1);msd[p.launch]=1});
  let cells="";const nm=parse(m0);nm.setMonth(nm.getMonth()+1);const lastDay=addDays(iso(nm),-1),weeks=Math.ceil((diff(first,lastDay)+1)/7);
  for(let i=0;i<weeks*7;i++){const d=addDays(first,i),c=tdays[d]||0;
    cells+=`<button class="cd ${parse(d).getMonth()!==mo?"out":""} ${d===T?"td":""} ${d===ui.day?"sel":""} ${msd[d]?"ms":""}" data-act="day" data-v="${d}" aria-label="${fmt(d)}${c?", "+c+" việc":""}${msd[d]?", có mốc":""}" ${d===ui.day?'aria-pressed="true"':""}>${parse(d).getDate()}<span class="dots">${"<i></i>".repeat(Math.min(c,3))}</span></button>`}
  const md=parse(m0);
  let body="";
  if(ui.railTab==="day"){
    const ts=state.tasks.filter(t=>inScope(t)&&dayOf(t)===ui.day).sort((a,b)=>(a.status==="done")-(b.status==="done")||(b.priority||2)-(a.priority||2));
    const carry=ui.day===T?state.tasks.filter(t=>inScope(t)&&isLate(t)&&dayOf(t)!==T):[];
    const row=t=>{const p=proj(t.projectId);return `<div class="dt ${t.status==="done"?"done":""} ${isLate(t)?"late":""}"><input type="checkbox" class="chk" data-act="toggle" data-id="${t.id}" ${t.status==="done"?"checked":""} aria-label="Đánh dấu xong: ${esc(t.title)}"><div class="bd"><b data-act="editTask" data-id="${t.id}">${esc(t.title)}</b><div class="meta">${ui.scope==="all"?pjH(p):""}${t.dept?`<span>${esc(t.dept)}</span>`:""}${t.owner?`<span>· ${esc(t.owner)}</span>`:""}${isLate(t)?`<span style="color:var(--bad);font-weight:600">· ${rel(t.due)}</span>`:""}</div>${(t.tags||[]).length&&!isLate(t)?`<div class="meta">${t.tags.slice(0,3).map(tagH).join("")}</div>`:""}</div></div>`};
    body=`<div class="dh"><b>${ui.day===T?"Hôm nay":fmt(ui.day)}</b><span>· ${ts.filter(t=>t.status==="done").length}/${ts.length} xong</span><span class="sp"></span>${ui.day!==T?`<button class="link" data-act="day" data-v="${T}">Về hôm nay</button>`:""}</div>
      <div class="dlist">${carry.length?`<div class="secl bad">Quá hạn (${carry.length})</div>${carry.map(row).join("")}<div class="secl">Trong ngày (${ts.length})</div>`:""}
      ${ts.length?ts.map(row).join(""):`<div class="empty">Chưa có việc cho ngày này.</div>`}</div>
      <div class="qa">${ui.scope==="all"?`<select id="qaProj" aria-label="Dự án cho việc mới">${AP().map(p=>`<option value="${p.id}" ${p.id===ui.lastQP?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`:""}<input id="quick" placeholder="Thêm việc cho ngày này…" aria-label="Thêm nhanh việc"><button data-act="quickAdd" aria-label="Thêm việc">+</button></div>
      <div class="hint">Gõ <code>#tag</code> để gắn tag, <code>@tên</code> để giao người.</div>`;
  }else{
    const ms=scoped().flatMap(p=>[...p.milestones.map(m=>({...m,p})),{id:"L"+p.id,name:"🚀 Launch",date:p.launch,done:false,p}]).filter(m=>!m.done&&m.date>=T&&diff(T,m.date)<=45).sort((a,b)=>a.date.localeCompare(b.date));
    body=`<div class="dlist">${ms.length?ms.map(m=>`<div class="dt"><div class="bd"><b data-act="day" data-v="${m.date}">${esc(m.name)}</b><div class="meta">${ui.scope==="all"?pjH(m.p):""}<span>${fmt(m.date)} · còn ${diff(T,m.date)} ngày</span></div></div></div>`).join(""):`<div class="empty">Không có mốc nào trong 45 ngày tới.</div>`}</div>`;
  }
  $("rail").innerHTML=`<div class="cal"><div class="chd"><h3>Tháng ${md.getMonth()+1} <span>${md.getFullYear()}</span></h3><button data-act="calShift" data-v="-1" aria-label="Tháng trước">‹</button><button data-act="calShift" data-v="1" aria-label="Tháng sau">›</button></div>
    <div class="cg">${["T2","T3","T4","T5","T6","T7","CN"].map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="callegend"><span><b></b>Có việc</span><span><i></i>Mốc / launch</span></div></div>
    <div class="daily"><div class="seg" role="group"><button class="${ui.railTab==="day"?"on":""}" data-act="railTab" data-v="day" aria-pressed="${ui.railTab==="day"}">Việc trong ngày</button><button class="${ui.railTab==="ms"?"on":""}" data-act="railTab" data-v="ms" aria-pressed="${ui.railTab==="ms"}">Mốc sắp tới</button></div>${body}</div>`;
}

/* ===== dialogs ===== */
const dlg=$("dlg"),dform=$("dlgForm");let dlgSubmit=null;
function openDlg(html,fn){dform.innerHTML=html;dlgSubmit=fn;dlg.showModal();const f=dform.querySelector("input:not([type=radio]),select,textarea");if(f)f.focus()}
dform.addEventListener("submit",e=>{const b=e.submitter;if(b&&b.value==="ok"&&dlgSubmit){const fd=Object.fromEntries(new FormData(dform));if(dlgSubmit(fd)===false)e.preventDefault()}else if(b&&b.value==="del"&&dlgSubmit){if(dlgSubmit(null)===false)e.preventDefault()}else if(b&&b.value==="complete"&&dlgSubmit){dlgSubmit("complete")}});
function projectDialog(p){
  const isNew=!p,T=today();
  p=p||{name:"",color:COLORS[state.projects.length%COLORS.length],start:T,launch:addDays(T,30),departments:["Sản phẩm","Kỹ thuật","Marketing","Bán hàng"],milestones:[]};
  openDlg(`<h3>${isNew?"Tạo dự án mới":"Sửa dự án"}</h3>
    <label class="fld">Tên dự án<input name="name" required value="${esc(p.name)}" placeholder="Ví dụ: Ra mắt app v2"></label>
    <div class="f2"><label class="fld">Ngày bắt đầu<input type="date" name="start" required value="${p.start}"></label><label class="fld">Ngày launch<input type="date" name="launch" required value="${p.launch}"></label></div>
    <label class="fld">Các bộ phận<input name="departments" value="${esc(p.departments.join(", "))}"><small>Cách nhau bởi dấu phẩy. Muốn đổi tên bộ phận mà vẫn giữ các việc đã gắn, hãy dùng mục Quản lý.</small></label>
    <fieldset class="fld" style="border:0;padding:0;margin:0"><legend style="margin-bottom:6px">Màu dự án</legend><div class="swatches">${COLORS.map((c,i)=>`<label><input type="radio" name="color" value="${c}" ${p.color===c?"checked":""} aria-label="Màu ${i+1}"><span class="sw" style="--c:${c}"></span></label>`).join("")}</div></fieldset>
    <div class="dlgfoot">${isNew?"":`<button class="btn danger" value="del" formnovalidate>Xóa dự án</button><button class="btn line" value="complete" formnovalidate>✓ Hoàn thành</button>`}<span class="sp"></span><button class="btn line" value="cancel" formnovalidate>Hủy</button><button class="btn y" value="ok">${isNew?"Tạo dự án":"Lưu thay đổi"}</button></div>`,
  fd=>{
    if(fd==="complete"){completeProject(p.id);return}
    if(fd===null){const n=tasksOf(p.id).length;if(!confirm(`Xóa dự án “${p.name}” cùng ${n} việc và các ghi chú? Có thể hoàn tác trong 5 giây.`))return false;
      snapshotUndo(`Đã xóa dự án “${p.name}”`);state.tasks=state.tasks.filter(t=>t.projectId!==p.id);state.notes=state.notes.filter(x=>x.projectId!==p.id);state.projects=state.projects.filter(x=>x.id!==p.id);ui.scope="all";persist();return}
    if(fd.launch<fd.start){alert("Ngày launch phải sau ngày bắt đầu.");return false}
    const data={name:fd.name.trim(),start:fd.start,launch:fd.launch,color:fd.color||p.color,departments:fd.departments.split(",").map(s=>s.trim()).filter(Boolean)};
    if(isNew){const np={id:uid(),milestones:[],...data};state.projects.push(np);ui.scope=np.id;ui.view="dash";toast(`Đã tạo dự án “${np.name}”`)}else{Object.assign(proj(p.id),data);toast("Đã lưu thay đổi")}
    persist();
  });
}
function taskDialog(t,pid,status){
  const isNew=!t,p0=proj(t?t.projectId:(pid||(ui.scope!=="all"?ui.scope:AP()[0]?.id)));
  if(!p0){projectDialog();return}
  t=t||{title:"",projectId:p0.id,dept:ui.f.dept&&p0.departments.includes(ui.f.dept)?ui.f.dept:"",tags:[],owner:"",day:ui.day,due:ui.day,status:status||"todo",priority:2,detail:""};
  const dOpts=pp=>`<option value="">Chưa chọn</option>`+(pp?.departments||[]).map(d=>`<option ${t.dept===d?"selected":""}>${esc(d)}</option>`).join("");
  openDlg(`<h3>${isNew?"Việc mới":"Sửa việc"}</h3>
    <label class="fld">Việc cần làm<input name="title" required value="${esc(t.title)}" placeholder="Ví dụ: Duyệt banner chiến dịch"></label>
    <div class="f2"><label class="fld">Dự án<select name="projectId" id="tProj">${AP().filter(x=>x.id!==t.projectId).concat(proj(t.projectId)||[]).sort((a,b)=>a.name.localeCompare(b.name,"vi")).map(x=>`<option value="${x.id}" ${x.id===t.projectId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label><label class="fld">Bộ phận<select name="dept" id="tDept">${dOpts(p0)}</select></label></div>
    <div class="f2"><label class="fld">Người phụ trách<input name="owner" list="dlO" value="${esc(t.owner)}" placeholder="Tên"></label><label class="fld">Tag<input name="tags" list="dlT" value="${esc((t.tags||[]).join(", "))}" placeholder="design, gấp"></label></div>
    <div class="f2"><label class="fld">Ngày làm<input type="date" name="day" value="${t.day||""}"></label><label class="fld">Hạn chót<input type="date" name="due" value="${t.due||""}"></label></div>
    <div class="f2"><label class="fld">Trạng thái<select name="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}</select></label><label class="fld">Ưu tiên<select name="priority">${[3,2,1].map(k=>`<option value="${k}" ${(t.priority||2)==k?"selected":""}>${PRIO[k]}</option>`).join("")}</select></label></div>
    <label class="fld">Mô tả<textarea name="detail" rows="3" placeholder="Bối cảnh, link tài liệu, tiêu chí hoàn thành…">${esc(t.detail||"")}</textarea></label>
    <datalist id="dlO">${owners().map(o=>`<option value="${esc(o)}">`).join("")}</datalist><datalist id="dlT">${tagsAll().map(o=>`<option value="${esc(o)}">`).join("")}</datalist>
    <div class="dlgfoot">${isNew?"":`<button class="btn danger" value="del" formnovalidate>Xóa việc</button>`}<span class="sp"></span><button class="btn line" value="cancel" formnovalidate>Hủy</button><button class="btn y" value="ok">${isNew?"Thêm việc":"Lưu thay đổi"}</button></div>`,
  fd=>{
    if(fd===null){snapshotUndo(`Đã xóa “${t.title}”`);state.tasks=state.tasks.filter(x=>x.id!==t.id);persist();return}
    if(fd.day&&fd.due&&fd.due<fd.day){alert("Hạn chót không được trước ngày làm.");return false}
    const data={title:fd.title.trim(),projectId:fd.projectId,dept:fd.dept,owner:fd.owner.trim(),tags:fd.tags.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean),day:fd.day,due:fd.due,priority:Number(fd.priority),detail:fd.detail};
    let obj;if(isNew){obj={id:uid(),created:Date.now(),...data};state.tasks.push(obj)}else{obj=task(t.id);Object.assign(obj,data)}
    setStatus(obj,fd.status);persist();toast(isNew?`Đã thêm “${obj.title}”`:"Đã lưu thay đổi");
  });
  $("tProj").addEventListener("change",e=>{$("tDept").innerHTML=dOpts(proj(e.target.value))});
}

/* ===== events ===== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT"||el.closest("dialog"))return;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case"view":ui.view=v;render();try{window.scrollTo({top:0})}catch(_){}break;
    case"scope":ui.scope=v;ui.f.dept="";ui.gStart=null;ui.range=v==="all"?"all":"5w";render();break;
    case"theme":{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(LS+"-theme",r.dataset.theme)}catch(_){}break}
    case"newProject":projectDialog();break;
    case"editProject":projectDialog(proj(id));break;
    case"newTask":taskDialog(null,el.dataset.pid,el.dataset.status);break;
    case"editTask":taskDialog(task(id));break;
    case"demo":demo();break;
    case"toggle":{const t=task(id),prev=t.status;setStatus(t,el.checked?"done":"todo");persist();if(el.checked)toast(`Đã xong “${t.title}”`,()=>{setStatus(t,prev);persist()});break}
    case"day":ui.day=v;ui.calM=v.slice(0,7)+"-01";ui.railTab="day";render();break;
    case"calShift":{const d=parse(ui.calM);d.setMonth(d.getMonth()+Number(v));ui.calM=iso(d);renderRail();break}
    case"railTab":ui.railTab=v;renderRail();break;
    case"range":ui.range=v;ui.gStart=null;render();break;
    case"gShift":ui.gStart=addDays(gWindow().start,Number(v));render();break;
    case"gToday":ui.gStart=null;render();break;
    case"clearF":ui.f={tag:"",owner:"",dept:""};render();break;
    case"doneAll":ui.doneAll=!ui.doneAll;render();break;
    case"deptFilter":ui.f.dept=v;ui.view="board";render();break;
    case"quickAdd":quickAdd();break;
    case"msToggle":{proj(el.dataset.pid).milestones.find(x=>x.id===id).done=el.checked;persist();break}
    case"msDel":{const p=proj(el.dataset.pid),m=p.milestones.find(x=>x.id===id);snapshotUndo(`Đã xóa mốc “${m.name}”`);p.milestones=p.milestones.filter(x=>x.id!==id);persist();break}
    case"msAdd":{const n=$("msName").value.trim(),d=$("msDate").value;if(!n||!d){$("msName").focus();break}proj(el.dataset.pid).milestones.push({id:uid(),name:n,date:d,done:false});persist();toast(`Đã thêm mốc “${n}”`);break}
    case"addNote":addNote();break;
    case"completeP":completeProject(id);break;
    case"restoreP":{const p=proj(id);p.done=false;delete p.doneAt;persist();toast(`Đã khôi phục “${p.name}”`);break}
    case"deleteP":deleteProject(id);break;
    case"exportData":exportData();break;
    case"logout":if(confirm("Đăng xuất khỏi thiết bị này?")){sb.auth.signOut()}break;
    case"wsSwitch":wsDialog();break;
    case"wsRename":{const n=$("wsRename").value.trim();if(!n)break;sb.from("workspaces").update({name:n}).eq("id",ws).then(({error})=>{if(error){toast("Không đổi được: "+error.message);return}curWs().name=n;render();toast("Đã đổi tên không gian")});break}
    case"memAdd":{const em=$("newMem").value.trim().toLowerCase(),role=$("newMemRole").value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$("newMem").focus();toast("Email chưa đúng định dạng");break}
      sb.from("workspace_members").insert({workspace_id:ws,email:em,role}).then(async({error})=>{if(error){toast(error.code==="23505"?"Email này đã là thành viên":"Không thêm được: "+error.message);return}await loadMembers();render();toast(`Đã thêm ${em}. Gửi họ đường link trang để đăng nhập.`)});break}
    case"memDel":if(confirm(`Xóa quyền truy cập của ${v} vào không gian này?`)){sb.from("workspace_members").delete().eq("workspace_id",ws).eq("email",v).then(async({error})=>{if(error){toast("Không xóa được: "+error.message);return}await loadMembers();render();toast(`Đã xóa ${v}`)})}break;
    case"importFile":importFile();break;
    case"deptAdd":{const inp=$("newDept"),v2=inp.value.trim(),p=proj(ui.mgP);if(!v2){inp.focus();break}if(p.departments.includes(v2)){toast("Bộ phận này đã có");break}p.departments.push(v2);persist();$("newDept")?.focus();break}
    case"deptDel":{const p=proj(ui.mgP),n=state.tasks.filter(t=>t.projectId===p.id&&t.dept===v).length;snapshotUndo(`Đã xóa bộ phận “${v}”${n?` (${n} việc chuyển về “Chưa chọn”)`:""}`);p.departments=p.departments.filter(d=>d!==v);state.tasks.forEach(t=>{if(t.projectId===p.id&&t.dept===v)t.dept=""});persist();break}
    case"deptMove":{const p=proj(ui.mgP),i=Number(v);if(i<1)break;[p.departments[i-1],p.departments[i]]=[p.departments[i],p.departments[i-1]];persist();break}
    case"tagDel":{const n=state.tasks.filter(t=>(t.tags||[]).includes(v)).length;snapshotUndo(`Đã gỡ tag “#${v}” khỏi ${n} việc`);state.tasks.forEach(t=>{if(t.tags)t.tags=t.tags.filter(g=>g!==v)});persist();break}
    case"pin":{const n=state.notes.find(x=>x.id===id);n.pinned=!n.pinned;persist();break}
    case"delNote":{snapshotUndo("Đã xóa ghi chú");state.notes=state.notes.filter(x=>x.id!==id);persist();break}
  }
});
document.addEventListener("change",e=>{const el=e.target;if(el.closest("dialog"))return;
  if(el.dataset.act==="filter"){ui.f[el.dataset.k]=el.value;render()}
  else if(el.dataset.act==="status"){const t=task(el.dataset.id);setStatus(t,el.value);persist()}
  else if(el.id==="qaProj")ui.lastQP=el.value;
  else if(el.dataset.act==="mgP"){ui.mgP=el.value;render()}
  else if(el.dataset.ren)renameAll(el.dataset.ren,el.dataset.old,el.value);
});
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||dlg.open;
  if(e.key==="Enter"&&e.target.id==="quick"){e.preventDefault();quickAdd();return}
  if(e.key==="Enter"&&e.target.id==="msName"){e.preventDefault();document.querySelector("[data-act=msAdd]").click();return}
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&e.target.id==="noteTxt"){e.preventDefault();addNote();return}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.ren){e.preventDefault();e.target.blur();return}
  if(e.key==="Enter"&&e.target.id==="newMem"){e.preventDefault();document.querySelector("[data-act=memAdd]").click();return}
  if(e.key==="Enter"&&e.target.id==="newDept"){e.preventDefault();document.querySelector("[data-act=deptAdd]").click();return}
  if(e.key==="Escape"&&e.target.dataset&&e.target.dataset.ren){e.target.value=e.target.dataset.old;e.target.blur();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus()}
  else if((e.key==="n"||e.key==="N")&&AP().length){e.preventDefault();taskDialog(null)}
});
$("toastUndo").addEventListener("click",()=>{if(undoFn){const f=undoFn;undoFn=null;$("toast").classList.remove("show");f()}});
let qT;$("q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=e.target.value.trim();render()},200)});
$("q").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";ui.q="";render();e.target.blur()}});
function addNote(){const txt=$("noteTxt").value.trim();if(!txt){$("noteTxt").focus();return}
  state.notes.push({id:uid(),projectId:ui.scope!=="all"?ui.scope:$("noteProj").value,text:txt,type:$("noteType").value,pinned:$("notePin").checked,date:today(),created:Date.now()});persist();toast("Đã lưu ghi chú")}
function quickAdd(){
  const s=$("quick").value.trim();if(!s){$("quick").focus();return}
  const pid=ui.scope!=="all"?ui.scope:($("qaProj")?.value||AP()[0].id);ui.lastQP=pid;
  const tags=[...s.matchAll(/#([^\s#@]+)/g)].map(m=>m[1]),om=s.match(/@([^\s#@]+)/);
  const title=s.replace(/#[^\s#@]+/g,"").replace(/@[^\s#@]+/g,"").replace(/\s+/g," ").trim()||s;
  state.tasks.push({id:uid(),created:Date.now(),projectId:pid,title,tags,owner:om?om[1]:"",dept:"",day:ui.day,due:ui.day,status:"todo",priority:2,detail:""});
  persist();const n=$("quick");if(n)n.focus();
}

try{const th=localStorage.getItem(LS+"-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
loadLocal();render();initStore();
})();
</script>
